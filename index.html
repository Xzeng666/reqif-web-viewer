<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ReqIF Web Viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./static/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <a class="github-link" href="https://github.com/Xzeng666/reqif-web-viewer" target="_blank" rel="noopener noreferrer" title="跳转至 GitHub 项目仓库" aria-label="在新标签页打开 GitHub 仓库">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>
      </a>
      <span>ReqIF Web Viewer</span>
    </div>
    <div class="fileinfo" id="fileInfo"></div>
    <div id="filterBar" class="hidden">
      <button id="addFilterBtn" class="btn" title="添加筛选条件">+ 筛选</button>
      <div class="searchbox">
        <input type="text" id="searchInput" placeholder="搜索 ID、标题或内容" aria-label="搜索工作项">
        <button id="searchClear" class="hidden" title="清除搜索">×</button>
      </div>
      <select id="searchMode" class="view-select hidden" aria-label="关键词匹配方式">
        <option value="all">全部匹配</option>
        <option value="any">任一匹配</option>
      </select>
      <div id="filterChips"></div>
    </div>
    <select id="viewSelect" class="view-select hidden" title="切换视图">
      <option value="doc">文档</option>
      <option value="workitem">工作项</option>
    </select>
    <button type="button" class="btn" id="btnOpen">打开文件</button>
    <input type="file" id="fileInput" accept=".reqif,.reqifz" hidden>
  </header>

  <div id="fileMessage" role="status" class="hidden"></div>

  <dialog id="loadingDialog" aria-labelledby="fileStage" aria-busy="true">
    <div id="fileLoading">
      <span id="fileStage"></span>
      <span id="filePercent"></span>
    </div>
    <progress id="fileProgress" aria-labelledby="fileStage"></progress>
  </dialog>

  <div id="welcome">
    <div id="dropZone">
      <div class="dz-icon">📄</div>
      <h2>拖拽 ReqIF / ReqIFz 文件到此处</h2>
      <p>也可点击「打开文件」选择本机文件。</p>
      <p class="muted">文件在当前浏览器内处理。</p>
    </div>
  </div>

  <main id="viewer" class="hidden">
    <aside id="left">
      <div id="leftHead">
        <span id="leftTitle">目录树</span>
        <button id="leftCollapse" title="收起侧栏">«</button>
      </div>
      <div id="searchResults" class="hidden"></div>
      <nav id="tree"></nav>
    </aside>
    <div id="leftResizer" title="拖拽调整宽度"></div>
    <div id="leftReveal" class="hidden" title="展开目录树">▶</div>
    <section id="right">
      <div id="readerTools">
        <label id="bodyPicker" class="hidden">正文
          <select id="bodySelect"></select>
        </label>
        <div id="hitControls" class="hidden" aria-label="正文搜索定位">
          <span id="hitCount" aria-live="polite"></span>
          <button id="previousHit" type="button">上一处</button>
          <button id="nextHit" type="button">下一处</button>
        </div>
      </div>
      <div id="detailScroll" class="hidden">
        <div id="detailEmpty" class="empty">从左侧选择工作项</div>
        <div id="detail" class="hidden"></div>
      </div>
      <div id="detailTools" class="item-tools hidden"></div>
      <div id="docWrap" class="hidden">
        <div id="docScroll">
          <div id="docSpacer"></div>
          <div id="docEmpty" class="empty hidden">当前文件没有可显示的文档内容</div>
        </div>
        <aside id="docPanel" class="hidden">
          <div id="docPanelHead" title="点击折叠/展开面板">
            <span id="docPanelCaret" class="p-caret">▾</span>
            <span id="docPanelTitle" class="p-title"></span>
            <button id="docPanelClose" class="p-close" title="关闭面板">×</button>
          </div>
          <div id="docPanelBody"></div>
          <div id="docPanelTools" class="item-tools hidden">
            <button id="attributeSettings" class="icon-button" type="button" title="属性设置" aria-label="属性设置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3.4-1.2 1.7V12l1.2 1.7-2 3.4-2-.2-2 1-1 2h-4l-1-2-2-1-2 .2-2-3.4L4.2 12V8.9L3 7.2l2-3.4 2 .2Z" transform="translate(0 1)"/><circle cx="12" cy="11.5" r="3"/></svg>
            </button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="statusbar">
    <button id="statBtn" title="点击查看详细统计">📊 <span id="statText">未导入文件</span></button>
    <span id="statWarn" class="warn hidden" title=""></span>
  </footer>

  <div id="filterMenu" class="menu hidden"></div>
  <div id="comboMenu" class="menu hidden"></div>

  <div id="ctxMenu" class="hidden">
    <div class="ctx-item" data-act="expand-all-tree">展开整棵目录树</div>
    <div class="ctx-item" data-act="expand-subtree">展开该节点下全部层级</div>
    <div class="ctx-item" data-act="expand-one">展开该节点的下一层</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="collapse-subtree">收起该节点下全部层级</div>
    <div class="ctx-item" data-act="collapse-all-tree">收起整棵目录树</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="open-item">打开工作项详情</div>
  </div>

  <div id="statsModal" class="hidden">
    <div id="statsBox">
      <div id="statsHead">
        <span>统计信息</span>
        <button id="statsClose" title="关闭">×</button>
      </div>
      <div id="statsBody"></div>
    </div>
  </div>

  <dialog id="attributeDialog" aria-labelledby="attributeDialogTitle">
    <div class="dialog-head">
      <h2 id="attributeDialogTitle">显示字段</h2>
      <button id="resetAttributes" type="button">恢复默认</button>
      <button id="closeAttributes" class="icon-button dialog-close" type="button" title="关闭" aria-label="关闭属性设置">×</button>
    </div>
    <div id="attributeFields"></div>
  </dialog>

  <dialog id="mediaDialog" aria-labelledby="mediaTitle">
    <div class="dialog-head">
      <h2 id="mediaTitle"></h2>
      <button id="closeMedia" class="icon-button dialog-close" type="button" title="关闭" aria-label="关闭图片预览">×</button>
    </div>
    <div id="mediaStage"></div>
    <div id="imageTools" aria-label="图片缩放">
      <button id="zoomOut" class="icon-button" type="button" title="缩小" aria-label="缩小图片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6"/></svg>
      </button>
      <span id="zoomLevel" aria-live="polite"></span>
      <button id="zoomIn" class="icon-button" type="button" title="放大" aria-label="放大图片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6m-3-3v6"/></svg>
      </button>
    </div>
  </dialog>

  <script src="./static/vendor/saxes.min.js"></script>
  <script src="./static/zip.js"></script>
  <script src="./static/reqif.js"></script>
  <script src="./static/media.js"></script>
  <script src="./static/search.js"></script>
  <script src="./static/attributes.js"></script>
  <script src="./static/app.js"></script>
</body>
</html>
