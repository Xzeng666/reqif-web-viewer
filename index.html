<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ReqIF Web Viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./static/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <a class="github-link" href="https://github.com/Xzeng666/reqif-web-viewer" target="_blank" rel="noopener noreferrer" data-i18n-title="Open the GitHub repository" data-i18n-label="Open the GitHub repository in a new tab">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>
      </a>
      <span>ReqIF Web Viewer</span>
    </div>
    <div class="fileinfo" id="fileInfo"></div>
    <div id="filterBar" class="hidden">
      <button id="addFilterBtn" class="btn" data-i18n-title="Add filter" data-i18n="+ Filter"></button>
      <div class="searchbox">
        <input type="text" id="searchInput" data-i18n-placeholder="Search IDs, titles or content" data-i18n-label="Search work items">
        <button id="searchClear" class="hidden" data-i18n-title="Clear search">×</button>
      </div>
      <select id="searchMode" class="view-select hidden" data-i18n-label="Keyword matching">
        <option value="all" data-i18n="Match all"></option>
        <option value="any" data-i18n="Match any"></option>
      </select>
      <div id="filterChips"></div>
    </div>
    <select id="viewSelect" class="view-select hidden" data-i18n-title="Switch view">
      <option value="doc" data-i18n="Document"></option>
      <option value="workitem" data-i18n="Work item"></option>
    </select>
    <div class="top-actions">
      <details id="languageMenu">
        <summary class="language-trigger" data-i18n-label="Language" aria-controls="languageOptions">
          <svg viewBox="0 0 20 20" aria-hidden="true"><g id="languageGlobe"><circle cx="10" cy="10" r="8"/><ellipse cx="10" cy="10" rx="3.5" ry="8"/><path d="M2 10h16"/></g></svg>
        </summary>
        <div class="language-options" id="languageOptions" role="group" data-i18n-label="Language">
          <button type="button" value="auto" aria-pressed="true">
            <svg class="language-auto" viewBox="0 0 20 20" aria-hidden="true"><use href="#languageGlobe"/></svg>
            <span data-i18n="Automatic"></span>
          </button>
          <button type="button" value="zh-CN" lang="zh-CN" aria-pressed="false">
            <svg class="flag" viewBox="0 0 24 16" aria-hidden="true">
              <path fill="#de2910" d="M0 0h24v16H0z"/>
              <path fill="#ffde00" d="m4 1.6.7 2.1h2.2L5.1 5l.7 2.1L4 5.8 2.2 7.1 2.9 5 1.1 3.7h2.2zm4-.7.3.6.7-.1-.5.5.3.6-.6-.3-.5.5.1-.7-.6-.3.7-.1zm2 1.7.2.7h.7l-.5.4.2.7-.6-.4-.6.4.2-.7-.5-.4h.7zm0 2.3.2.7h.7l-.5.4.2.7-.6-.4-.6.4.2-.7-.5-.4h.7zM8 6.3l.7.2.5-.5-.2.7.6.3-.7.1-.2.7-.3-.6-.7.1.5-.5z"/>
            </svg>
            <span>简体中文</span>
          </button>
          <button type="button" value="en" lang="en" aria-pressed="false">
            <svg class="flag" viewBox="0 0 24 16" aria-hidden="true">
              <path fill="#012169" d="M0 0h24v16H0z"/>
              <path stroke="#fff" stroke-width="3.5" d="m0 0 24 16M24 0 0 16"/>
              <path stroke="#c8102e" stroke-width="1.5" d="m0 0 24 16M24 0 0 16"/>
              <path stroke="#fff" stroke-width="5" d="M12 0v16M0 8h24"/>
              <path stroke="#c8102e" stroke-width="3" d="M12 0v16M0 8h24"/>
            </svg>
            <span>English</span>
          </button>
          <button type="button" value="de" lang="de" aria-pressed="false">
            <svg class="flag" viewBox="0 0 24 16" aria-hidden="true">
              <path d="M0 0h24v16H0z"/><path fill="#d00" d="M0 5.33h24V16H0z"/><path fill="#ffce00" d="M0 10.67h24V16H0z"/>
            </svg>
            <span>Deutsch</span>
          </button>
        </div>
      </details>
      <button type="button" class="btn" id="btnOpen" data-i18n="Open file"></button>
    </div>
    <input type="file" id="fileInput" accept=".reqif,.reqifz" hidden>
  </header>

  <div id="fileMessage" role="status" class="hidden"></div>

  <dialog id="loadingDialog" aria-labelledby="fileStage" aria-busy="true">
    <div id="fileLoading">
      <span id="fileStage"></span>
      <span id="filePercent"></span>
    </div>
    <progress id="fileProgress" aria-labelledby="fileStage"></progress>
    <p id="loadingNote" class="muted hidden"></p>
  </dialog>

  <div id="compareBar" class="hidden">
    <span><span data-i18n="Old version"></span> <strong id="compareOldName"></strong></span>
    <span aria-hidden="true">→</span>
    <span><span data-i18n="New version"></span> <strong id="compareNewName"></strong></span>
  </div>

  <div id="welcome">
    <div id="dropZone">
      <div class="dz-icon">📄</div>
      <h2 data-i18n="Drop a ReqIF or ReqIFz file here"></h2>
      <p data-i18n="Or click “Open file”."></p>
      <p class="muted" data-i18n="Files are processed in this browser."></p>
    </div>
    <button type="button" id="compareWelcome" class="compare-button" aria-haspopup="dialog" data-i18n="Compare versions"></button>
  </div>

  <main id="viewer" class="hidden">
    <aside id="left">
      <div id="leftHead">
        <span id="leftTitle" data-i18n="Outline"></span>
        <button id="leftCollapse" data-i18n-title="Collapse sidebar">«</button>
      </div>
      <div id="searchResults" class="hidden"></div>
      <nav id="tree"></nav>
    </aside>
    <div id="leftResizer" data-i18n-title="Drag to resize"></div>
    <div id="leftReveal" class="hidden" data-i18n-title="Show outline">▶</div>
    <section id="right">
      <div id="readerTools">
        <label id="bodyPicker" class="hidden"><span data-i18n="Body"></span>
          <select id="bodySelect"></select>
        </label>
        <div id="hitControls" class="hidden" data-i18n-label="Body matches">
          <span id="hitCount" aria-live="polite"></span>
          <button id="previousHit" type="button" data-i18n="Previous match"></button>
          <button id="nextHit" type="button" data-i18n="Next match"></button>
        </div>
      </div>
      <div id="detailScroll" class="hidden">
        <div id="detailEmpty" class="empty" data-i18n="Select a work item on the left"></div>
        <div id="detail" class="hidden"></div>
      </div>
      <div id="detailTools" class="item-tools hidden"></div>
      <div id="docWrap" class="hidden">
        <div id="docScroll">
          <div id="docSpacer"></div>
          <div id="docEmpty" class="empty hidden"></div>
        </div>
        <aside id="docPanel" class="hidden">
          <div id="docPanelHead" data-i18n-title="Expand or collapse panel">
            <span id="docPanelCaret" class="p-caret">▾</span>
            <span id="docPanelTitle" class="p-title"></span>
            <button id="docPanelClose" class="p-close" data-i18n-title="Close panel">×</button>
          </div>
          <div id="docPanelBody"></div>
          <div id="docPanelTools" class="item-tools hidden">
            <button id="attributeSettings" class="icon-button" type="button" data-i18n-title="Field settings" data-i18n-label="Field settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3.4-1.2 1.7V12l1.2 1.7-2 3.4-2-.2-2 1-1 2h-4l-1-2-2-1-2 .2-2-3.4L4.2 12V8.9L3 7.2l2-3.4 2 .2Z" transform="translate(0 1)"/><circle cx="12" cy="11.5" r="3"/></svg>
            </button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="statusbar">
    <button id="statBtn" data-i18n-title="Show statistics">📊 <span id="statText" data-i18n="No file open"></span></button>
    <span id="statWarn" class="warn hidden" title=""></span>
    <button type="button" id="compareCurrent" class="compare-button hidden" aria-haspopup="dialog" data-i18n="Compare versions"></button>
    <div id="compareSummary" class="hidden" role="group" data-i18n-label="Filter by change status"></div>
    <div id="compareTools" class="hidden">
      <label><input id="compareChangesOnly" type="checkbox"> <span data-i18n="Changes only"></span></label>
      <details id="compareActions">
        <summary id="compareActionTrigger" class="btn" data-i18n="Comparison actions"></summary>
        <div class="compare-action-list">
          <button id="compareReplace" type="button" data-i18n="Replace files"></button>
          <button id="compareCsv" type="button" data-i18n="Export CSV"></button>
          <button id="compareHtml" type="button" data-i18n="Export HTML"></button>
          <button id="compareExit" type="button" data-i18n="Exit comparison"></button>
        </div>
      </details>
    </div>
  </footer>

  <dialog id="compareDialog" aria-labelledby="compareTitle">
    <div class="dialog-head">
      <h2 id="compareTitle" data-i18n="Compare versions"></h2>
      <button id="closeCompare" class="icon-button dialog-close" type="button" data-i18n-label="Close">×</button>
    </div>
    <div class="compare-pickers">
      <button class="compare-picker" id="chooseCompareOld" type="button" autofocus>
        <strong data-i18n="Old version"></strong>
        <span class="compare-file-name"></span>
      </button>
      <input type="file" id="compareOldFile" accept=".reqif,.reqifz" hidden>
      <button class="compare-picker" id="chooseCompareNew" type="button">
        <strong data-i18n="New version"></strong>
        <span class="compare-file-name"></span>
      </button>
      <input type="file" id="compareNewFile" accept=".reqif,.reqifz" hidden>
      <p id="compareError" class="hidden" role="status"></p>
      <button id="startCompare" type="button" class="btn" disabled data-i18n="Start comparison"></button>
    </div>
  </dialog>

  <div id="filterMenu" class="menu hidden"></div>
  <div id="comboMenu" class="menu hidden"></div>

  <div id="ctxMenu" class="hidden">
    <div class="ctx-item" data-act="expand-all-tree" data-i18n="Expand entire outline"></div>
    <div class="ctx-item" data-act="expand-subtree" data-i18n="Expand all child levels"></div>
    <div class="ctx-item" data-act="expand-one" data-i18n="Expand next level"></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="collapse-subtree" data-i18n="Collapse all child levels"></div>
    <div class="ctx-item" data-act="collapse-all-tree" data-i18n="Collapse entire outline"></div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-act="open-item" data-i18n="Open work item details"></div>
  </div>

  <div id="statsModal" class="hidden">
    <div id="statsBox">
      <div id="statsHead">
        <span data-i18n="Statistics"></span>
        <button id="statsClose" data-i18n-title="Close">×</button>
      </div>
      <div id="statsBody"></div>
    </div>
  </div>

  <dialog id="attributeDialog" aria-labelledby="attributeDialogTitle">
    <div class="dialog-head">
      <h2 id="attributeDialogTitle" data-i18n="Visible fields"></h2>
      <button id="resetAttributes" type="button" data-i18n="Reset"></button>
      <button id="closeAttributes" class="icon-button dialog-close" type="button" data-i18n-title="Close" data-i18n-label="Close field settings">×</button>
    </div>
    <div id="attributeFields"></div>
  </dialog>

  <dialog id="mediaDialog" aria-labelledby="mediaTitle">
    <div class="dialog-head">
      <h2 id="mediaTitle"></h2>
      <button id="closeMedia" class="icon-button dialog-close" type="button" data-i18n-title="Close" data-i18n-label="Close image preview">×</button>
    </div>
    <div id="mediaStage"></div>
    <div id="imageTools" data-i18n-label="Image zoom">
      <button id="zoomOut" class="icon-button" type="button" data-i18n-title="Zoom out" data-i18n-label="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6"/></svg>
      </button>
      <span id="zoomLevel" aria-live="polite"></span>
      <button id="zoomIn" class="icon-button" type="button" data-i18n-title="Zoom in" data-i18n-label="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6m-3-3v6"/></svg>
      </button>
    </div>
  </dialog>

  <script src="./static/i18n.js"></script>
  <script src="./static/vendor/saxes.min.js"></script>
  <script src="./static/zip.js"></script>
  <script src="./static/reqif.js"></script>
  <script src="./static/media.js"></script>
  <script src="./static/search.js"></script>
  <script src="./static/attributes.js"></script>
  <script src="./static/compare.js"></script>
  <script src="./static/compare-view.js"></script>
  <script src="./static/app.js"></script>
</body>
</html>
